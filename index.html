<!doctype html><!--현재 문서가 HTML 문서라는 것을 브라우저에 알린다.-->
<html lang = "ko"><!--문서 전체의 시작이며, 내용이 한국어임을 나타낸다.-->
<head><!--문서에 대한 설정이 들어간다.-->
    <meta charset = "UTF-8"><!--문자가 깨지지 않도록 문자 인코딩 지정-->
    <mtea name = "veiwport" content = "width=device-width, initial-scale=1.0">
    <title>나의 할 일</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><!--화면에 보이는 본문-->
    <header>
        <h1 style="text-align: center;">나의 할 일</h1>
        <p style="text-align: center;">오늘 해야 할 일을 간단하게 관리해 보세요.</p>
    </header>
   <main>
    <section>
        <h2>할 일 등록</h2>

        <form id="todo-form">
            <input 
            id="todo-input"
            type="text"
            placeholder="할 일을 입력하세요"
            autocomplete="off"
            required>
            <button type="submit">추가</button>
        </form>
    </section>

    <section>
        <h2>할 일 목록</h2>

        <div>
            <button type="button">전체</button>
            <button type="button">진행 중</button>
            <button type="button">완료</button>
        </div>

        <p>남은 할 일 : <strong>0</strong>개</p>

        <ul id="todo-list">
            <li>
                <span>HTML 공부하기</span>
                <button type="button">완료</button>
                <button type="button">삭제</button>
            </li>
        </ul>
    </section>
   </main>

   <footer>
    <p>정도현의 방학 찍먹 프로젝트</p>
   </footer>
</body>
</html>
